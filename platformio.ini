; Loopster firmware — C++ port of the original CircuitPython firmware
; Board: custom RP2040 "Loopster", 16 MB flash. Core: arduino-pico (earlephilhower).
; Build:  pio run          -> .pio/build/loopster/firmware.uf2
; Flash:  drag UF2 to BOOTSEL drive, or: picotool load -f .pio/build/loopster/firmware.uf2

[env:loopster]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

; Re-touch fw_version.cpp each build so __DATE__ (reported to the web UI as "built") is fresh
extra_scripts = pre:version_stamp.py

; 16 MB flash = 2 MB sketch + 14 MB FatFS
board_upload.maximum_size = 16777216
board_build.filesystem_size = 14m

; Stock clock — C++ doesn't need the CircuitPython-era 270 MHz overclock
board_build.f_cpu = 133000000L

; TinyUSB stack -> composite MIDI + CDC + MSC
; NO_ADAFRUIT_SSD1306_COLOR_COMPATIBILITY: stops the SSD1306 header from defining
; bare BLACK/WHITE macros that collide with C::BLACK / C::WHITE
; LOOPSTER_TEST_HOOKS: TEST_* serial commands for scripts/loopster_test.py —
; ship customer units from [env:loopster-release] below, which omits it
build_flags =
    -DUSE_TINYUSB
    -DNO_ADAFRUIT_SSD1306_COLOR_COMPATIBILITY
    -DLOOPSTER_TEST_HOOKS

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit SSD1306
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson

monitor_speed = 115200

; Customer/release build — identical firmware except NO test hooks: every TEST_*
; command, the Inputs injection plumbing, and the loop-heartbeat counters compile
; out entirely (#ifdef LOOPSTER_TEST_HOOKS).  Build: pio run -e loopster-release
[env:loopster-release]
extends = env:loopster
build_flags =
    -DUSE_TINYUSB
    -DNO_ADAFRUIT_SSD1306_COLOR_COMPATIBILITY
